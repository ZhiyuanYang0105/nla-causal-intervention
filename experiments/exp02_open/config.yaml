# exp02: REAL local run with fully-open (ungated) models — no HF auth needed.
# Runs on MacBook M5 / 16GB via MPS. M=Qwen2.5-0.5B, AV/paraphraser=Qwen2.5-0.5B-Instruct.
extends: configs/default.yaml

experiment:
  id: exp02_open
  description: "Real local pilot, ungated models (Qwen2.5-0.5B), readout AR."

target_model:            # M — frozen; residual-stream activations h_l
  name: Qwen/Qwen2.5-0.5B      # base, ungated, Llama-like (.model.layers); 24 layers, d=896
  num_layers: 24
  hidden_size: 896
  layer_l: 12             # middle layer
  dtype: float16
  device: mps

paraphraser:             # shared by AV (summary) and the rewrite conditions
  model: Qwen/Qwen2.5-0.5B-Instruct
  runtime: transformers   # mlx not installed; transformers on MPS
  decoding: {temperature: 0.7, max_tokens: 64}

ar:                      # frozen-M readout + closed-form ridge
  type: readout
  readout: {model: Qwen/Qwen2.5-0.5B, layer: 12}
  bow: {n_features: 4096, ngram: [1, 2]}
  feat_pca: 64            # reduce surface features to 64 dims (fittable when n_train>64)
  ridge_alpha: [1, 10, 100, 1000, 5000]   # CV-selected on a val split

embedding:
  model: sentence-transformers/all-MiniLM-L6-v2

data:
  corpus: HuggingFaceFW/fineweb
  subset: sample-10BT
  streaming: true
  n_samples: 300          # enough for the 64-dim ridge to fit (n_train ~210 > 64)
  min_snippet_tokens: 24
  max_snippet_tokens: 96
  pooling: mean           # target = mean-pooled activation (reflects overall semantics)
  store_dtype: float16
  seed: 20260612

conditions:
  enabled: [C0, C1, C2, C3, C4]
