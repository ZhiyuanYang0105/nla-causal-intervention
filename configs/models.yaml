# LOCAL-BUDGET config (MacBook M5 / 16GB). See docs/local_budget_plan.md.
# Principle: all LLMs FROZEN; only a small ridge head is "trained" (closed-form).
# NLA operates in ACTIVATION space: h_l --AV--> z --AR--> h_hat_l.

target_model:            # M — frozen; produces residual-stream activations h_l
  name: meta-llama/Llama-3.2-1B   # 1B base (3B optional). NOT 8B (won't fit w/ activations).
  num_layers: 16
  hidden_size: 2048        # d_model = dim of h_l (3B -> 3072)
  layer_l: 8               # middle layer (~0.5 depth); sweep {6,8,10} in pilot
  token_position: last     # pooling: "last" (paper) or "mean"
  dtype: float16
  device: mps
  hook: "model.layers.{layer_l}.output[0]"   # single layer only — never all-layers

av:                      # Activation Verbalizer — TRAINING-FREE (Tier-0 summary proxy)
  type: summary_proxy      # z = Instruct.summarize(source_snippet); see local_budget_plan §2
  model: meta-llama/Llama-3.2-3B-Instruct   # quality matters; 1B-Instruct = faster fallback
  runtime: mlx             # mlx-lm (fast on Apple silicon) | transformers
  decoding: {temperature: 0.7, max_tokens: 96}
  # Tier-1 upgrade (activation-conditioned, train only a projection) deferred.

paraphraser:             # conditions/* rewriter — frozen Instruct, prompt-only
  model: meta-llama/Llama-3.2-3B-Instruct   # or Llama-3.2-1B-Instruct (3-4x faster)
  runtime: mlx
  decoding: {temperature: 0.7, max_tokens: 128}
  # optional higher quality (inference only): Llama-3.1-8B-Instruct 4-bit via MLX

ar:                      # Activation Reconstructor — frozen features + closed-form ridge
  type: readout            # readout (frozen-M, recommended) | bow (cheapest) | semantic (ref)
  # AR MUST be surface-sensitive — do NOT use a semantic embedder as AR (biases to H1).
  readout:
    model: meta-llama/Llama-3.2-1B   # reuse frozen M
    layer: 8                         # layer to read z's last-token hidden from
  bow:
    n_features: 4096                 # hashing n-gram TF dim
    ngram: [1, 2]
  ridge_alpha: 10.0                  # L2 regularization (CV in pilot)

embedding:               # sim_zz' manipulation check ONLY (semantic, paraphrase-invariant)
  model: sentence-transformers/all-MiniLM-L6-v2   # ~90MB, fast

seed: 20260612
