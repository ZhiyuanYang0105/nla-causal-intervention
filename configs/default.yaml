# Default experiment config. Override per-experiment (see experiments/exp01_pilot/config.yaml).

defaults:
  models: configs/models.yaml
  conditions: configs/conditions.yaml

# LOCAL-BUDGET: activations h_l from frozen M (Llama-3.2-1B) over FineWeb.
# Cache ONLY selected-layer pooled vectors in fp16 (see local_budget_plan §4).
data:
  corpus: HuggingFaceFW/fineweb
  subset: sample-10BT     # stream + sub-sample
  streaming: true
  eval_holdout_docs: 20000
  split: eval
  n_samples: 200          # LOCAL pilot size (100-500); not null
  min_snippet_tokens: 16
  max_snippet_tokens: 128 # seq len cap = 128 (use 64 for short text)
  pooling: last           # last (paper) | mean — ONE vector per sample
  store_dtype: float16    # fp16 on disk
  stratify_by: domain
  seed: 20260612

# reconstruction is measured in ACTIVATION space (FVE), not on text.
metrics:
  reconstruction:
    primary: fve
    report: [fve, activation_cosine, activation_mse]
  semantic: [sim_zz_prime]          # on explanation TEXT (manipulation check)
  length: [delta_len, len_ratio]
  token_shift: [jaccard_tokens, ngram_overlap, edit_distance_norm, js_divergence, ppl_shift]

stats:
  paired: true
  omnibus: friedman              # friedman | rm_anova
  pairwise: wilcoxon             # vs baseline condition
  correction: holm               # holm | fdr_bh | bonferroni
  effect_size: [cohen_dz, rank_biserial]
  mixed_model: "fve ~ condition + len_ratio + (1|input_id)"
  mechanism_model: "delta_fve ~ surface_shift + sim_zz_prime + len_ratio + (1|input_id)"
  bootstrap_n: 5000
  alpha: 0.05

output:
  results_dir: results
  save_intermediate: true        # persist z, z', x_hat to data/interim
